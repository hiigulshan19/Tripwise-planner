<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tripwise Budget Planner</title>
  <style>
    :root{--green:#0d6b63;--dark:#123d3a;--paper:#fffdf9;--bg:#f4f7f8;--line:#dce2e7;--muted:#68727d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17202a;font-family:Arial,sans-serif;line-height:1.45}header{background:var(--dark);color:white;padding:28px max(20px,8vw) 70px}.logo{font-weight:800;font-size:23px}.logo span{color:#f6ca6d}h1{max-width:760px;font-size:clamp(34px,6vw,66px);line-height:1;margin:56px 0 14px;letter-spacing:-2px}header p{color:#d0e0dd;max-width:600px}main{max-width:1120px;margin:-32px auto 0;padding:0 18px 50px}.layout{display:grid;grid-template-columns:330px 1fr;gap:22px;align-items:start}.box{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 28px #183c3d12}.form{padding:24px;position:sticky;top:16px}h2{margin:0;font-size:22px}h3{margin:0}.muted{color:var(--muted);font-size:14px}label{display:block;font-size:13px;font-weight:bold;margin:15px 0 5px}input,select{width:100%;padding:10px;border:1px solid #cbd5dc;border-radius:8px;font-size:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.interests{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}.chip{border:1px solid #cbd5dc;border-radius:30px;padding:6px 9px;font-size:12px;cursor:pointer}.chip input{width:auto}.primary{width:100%;border:0;border-radius:9px;background:var(--green);color:white;font-weight:bold;padding:12px;margin-top:20px;cursor:pointer}.result{padding:26px}.empty{text-align:center;padding:64px 20px;color:var(--muted)}.top{display:flex;justify-content:space-between;gap:15px}.status{color:#075149;background:#e5f3f0;border-radius:20px;padding:7px 10px;font-size:13px;font-weight:bold;white-space:nowrap}.budget{margin-top:20px;padding:22px 26px}.numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.number{background:#f8f8f4;border-left:3px solid #f2b84b;padding:10px}.number small{display:block;color:var(--muted)}.number b{font-size:18px}.bar{height:13px;border-radius:30px;overflow:hidden;background:#e8edec;display:flex}.bar i{display:block;height:100%}.legend{font-size:12px;color:var(--muted);margin-top:8px}.itinerary{margin-top:20px;padding:26px}.day{display:grid;grid-template-columns:82px 1fr;gap:13px;border-top:1px solid var(--line);padding:17px 0}.day:first-of-type{border-top:0}.day-label{font-size:13px;color:var(--muted);font-weight:bold}.day-label b{display:block;font-size:16px;color:#17202a}.stop{border-left:2px solid #a9cec7;padding:7px 0 7px 13px;margin:3px 0}.stop strong{font-size:14px}.cost{float:right;color:#075149;font-size:13px}.stop p{font-size:13px;color:var(--muted);margin:3px 0 0}.action{float:right;border:1px solid #adc6c2;background:white;color:#075149;border-radius:7px;padding:7px 9px;cursor:pointer}@media(max-width:760px){.layout{grid-template-columns:1fr}.form{position:static}.numbers{grid-template-columns:1fr}.top{flex-direction:column}.day{grid-template-columns:65px 1fr}}@media print{header,.form,.action{display:none}main{margin:0}.layout{display:block}.box{box-shadow:none;border:0}}
  </style>
</head>
<body>
  <header><div class="logo">trip<span>wise</span></div><h1>Travel plans that know when to stop spending.</h1><p>Set your budget, timing, and interests. Get a balanced city break designed around what matters to you.</p></header>
  <main><div class="layout">
    <form class="box form" id="form"><h2>Plan your trip</h2><p class="muted">Tell us the shape of the getaway.</p>
      <label>Destination<input id="destination" value="Jaipur" required></label>
      <div class="row"><label>Days<input id="days" type="number" min="2" max="10" value="4"></label><label>Travelers<input id="travelers" type="number" min="1" value="2"></label></div>
      <div class="row"><label>Budget (₹)<input id="budget" type="number" min="3000" value="30000"></label><label>Travel pace<select id="pace"><option>Relaxed</option><option selected>Balanced</option><option>Packed</option></select></label></div>
      <label>What sounds good?</label><div class="interests"><label class="chip"><input type="checkbox" value="Culture" checked> Culture</label><label class="chip"><input type="checkbox" value="Food" checked> Food</label><label class="chip"><input type="checkbox" value="Nature"> Nature</label><label class="chip"><input type="checkbox" value="Shopping"> Shopping</label></div>
      <button class="primary">Build my itinerary</button>
    </form>
    <section id="output"><div class="box empty"><b>Your itinerary will appear here.</b><br>Start with a destination and a realistic total budget.</div></section>
  </div></main>
  <script>
    const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Math.round(n));
    const genericIdeas={Culture:['Old city heritage walk','Signature museum visit','Golden-hour landmark visit'],Food:['Breakfast at a local favourite','Street-food tasting stop','Dinner with regional dishes'],Nature:['Morning garden walk','Scenic local outing'],Shopping:['Crafts and market browse','Neighbourhood design walk']};
    const cityIdeas={
      delhi:{
        Culture:['India Gate','Humayun’s Tomb','Lotus Temple','Qutub Minar','Red Fort','Jama Masjid','Akshardham Temple','Agrasen ki Baoli','Purana Qila'],
        Food:['Chandni Chowk food walk','Paranthe Wali Gali','Dilli Haat INA food stalls','Connaught Place café stop','Nizamuddin local-food stop'],
        Nature:['Lodhi Garden','Sunder Nursery','Garden of Five Senses','India Gate lawns'],
        Shopping:['Dilli Haat INA','Janpath Market','Khan Market','Sarojini Nagar Market']
      },
      jaipur:{
        Culture:['Amber Fort','City Palace','Hawa Mahal','Jantar Mantar','Albert Hall Museum','Nahargarh Fort'],
        Food:['Johari Bazaar snack stop','Laxmi Misthan Bhandar','Rajasthani thali dinner','Masala chai stop'],
        Nature:['Jal Mahal viewpoint','Central Park','Sisodia Rani Garden'],
        Shopping:['Bapu Bazaar','Johari Bazaar','Tripolia Bazaar']
      }
    };
    document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();let destination=document.getElementById('destination').value||'Your destination',days=+document.getElementById('days').value,people=+document.getElementById('travelers').value,total=+document.getElementById('budget').value,pace=document.getElementById('pace').value;let interests=[...document.querySelectorAll('.chip input:checked')].map(x=>x.value);if(!interests.length)interests=['Culture'];let city=destination.toLowerCase().includes('delhi')?'delhi':destination.toLowerCase().includes('jaipur')?'jaipur':'';let ideas=cityIdeas[city]||genericIdeas;let buffer=total*.12,usable=total-buffer,lodging=usable*.38,food=usable*.25,transport=usable*.14,activities=usable-lodging-food-transport;let perDay=pace==='Relaxed'?2:pace==='Packed'?4:3,used=0,daysHtml='';for(let day=1;day<=days;day++){let stops='';for(let n=0;n<perDay;n++){let group=interests[(day+n)%interests.length],title=ideas[group][(day+n)%ideas[group].length],cost=Math.min(Math.round((100+n*150)*people),Math.max(0,activities-used));used+=cost;stops+=`<div class="stop"><strong>${title}</strong><span class="cost">${cost?money(cost):'Free'}</span><p>${group} stop selected around your interests and activity allowance.</p></div>`}daysHtml+=`<article class="day"><div class="day-label"><b>Day ${day}</b>${day===1?'Arrival & explore':day===days?'A gentle finish':'Discover'}</div><div>${stops}</div></article>`}let estimate=lodging+food+transport+used+buffer,remain=total-estimate;document.getElementById('output').innerHTML=`<section class="box result"><div class="top"><div><p class="muted">${pace} · ${interests.join(' · ')}</p><h2>${days} days in ${destination}</h2><p class="muted">For ${people} traveler${people>1?'s':''} · estimates include a 12% buffer</p></div><span class="status">${remain>=0?'Within budget':'Needs adjustment'}</span></div></section><section class="box budget"><h3>Budget at a glance</h3><div class="numbers"><div class="number"><small>Trip budget</small><b>${money(total)}</b></div><div class="number"><small>Estimated plan</small><b>${money(estimate)}</b></div><div class="number"><small>Per day</small><b>${money(estimate/days)}</b></div></div><div class="bar"><i style="width:${lodging/total*100}%;background:#0d6b63"></i><i style="width:${food/total*100}%;background:#f2b84b"></i><i style="width:${transport/total*100}%;background:#6184a4"></i><i style="width:${used/total*100}%;background:#ab6f4b"></i></div><p class="legend">Stay ${money(lodging)} · Food ${money(food)} · Transport ${money(transport)} · Activities ${money(used)} · Buffer ${money(buffer)}</p></section><section class="box itinerary"><button class="action" onclick="window.print()">Print / save PDF</button><h3>Your day-by-day plan</h3><p class="muted">${city?'Real places selected for '+destination+'.':'A budget-conscious starting point that you can tailor.'}</p>${daysHtml}</section>`;});
  </script>
</body>
</html>
